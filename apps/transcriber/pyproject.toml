[project]
name = "nuit-transcriber"
version = "0.1.0"
description = "Nuit One guitar intake: audio + video in; pitch, string/fret/finger, techniques and tempo map out."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Innovaciones MADFAM SAS de C.V." }]
dependencies = [
  # numpy<2: torch 2.2.2 (the last Intel-macOS wheel) and mediapipe 0.10.21 are numpy-1 builds.
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  # demucs 4.1.0 is the first release that pins torch<2.3 on Intel macOS instead of failing to resolve.
  "demucs>=4.1.0",
  # Only the ONNX model is used; the TF/CoreML runtimes basic-pitch pulls in are overridden away below.
  "basic-pitch[onnx]==0.4.0",
  "onnxruntime>=1.20,<1.24",
  "beat-this>=1.1.0",
  # 0.10.21 is the last mediapipe release with an Intel-macOS (universal2) wheel.
  "mediapipe==0.10.21",
  "yt-dlp[default]>=2026.8.19",
  "mido>=1.3",
  "pretty-midi>=0.2.10",
  "jsonschema>=4.21",
  # resampy (via basic-pitch) still imports pkg_resources, removed from setuptools after 80.x
  "setuptools>=70,<81",
]

[project.scripts]
nuit-transcribe = "nuit_transcriber.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuit_transcriber"]

[tool.uv]
# The lockfile must install on the developer machines (Intel macOS) and in the container (Linux x86_64).
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# torch 2.2.2 is the last release with Intel-macOS wheels; torchaudio must match it there.
constraint-dependencies = [
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  # last numba/llvmlite releases that still publish Intel-macOS wheels
  "numba<=0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "llvmlite<=0.45.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# basic-pitch 0.4.0 hard-requires a TensorFlow (Linux) or CoreML (macOS) runtime even though it
# ships an ONNX model. A never-true marker drops them from the resolution; inference uses onnxruntime.
override-dependencies = [
  "tensorflow; sys_platform == 'never'",
  "tensorflow-macos; sys_platform == 'never'",
  "coremltools; sys_platform == 'never'",
  "tflite-runtime; sys_platform == 'never'",
  # demucs 4.1 reads/writes files through sphn, which has no Intel-macOS wheel. The engine decodes
  # audio itself and calls demucs.apply.apply_model on tensors, so sphn is only kept where it installs.
  "sphn>=0.1.12; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv.sources]
# CPU-only torch on Linux (the container); PyPI's default Linux wheel drags in ~2.5 GB of CUDA.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights or media; skipped unless NUIT_SLOW_TESTS=1"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
