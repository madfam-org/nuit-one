name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  networkpolicy-port-lint:
    name: NetworkPolicy port consistency
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Prevents the 2026-05-04 status.enclii.dev outage class:
    # NetworkPolicy `ports:` clauses that don't intersect the selected pods'
    # containerPorts (silent CNI drop, hours to diagnose).
    # See scripts/check-networkpolicy-ports.py for full rationale.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run NetworkPolicy port lint
        run: python3 scripts/check-networkpolicy-ports.py infra/k8s/

  transcriber:
    name: Transcriber (ruff + fast tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/transcriber
    steps:
      - uses: actions/checkout@v4
      # setup-uv publishes no floating major tag (`@v10` does not resolve); pin the release commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Lint
        run: |
          uvx ruff@0.16.10 check src tests
          uvx ruff@0.16.10 format --check src tests
      - name: Fast tests
        env:
          PYTHONPATH: src
        # numpy for the engine maths, jsonschema for the document contract, music21 for the
        # MusicXML round trip; still no torch, model weights or media.
        run: >-
          uv run --python 3.11 --isolated --no-project
          --with 'pytest>=8.3' --with 'numpy>=1.26,<2' --with 'jsonschema>=4.21' --with 'music21>=10.5.0'
          pytest -q

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit Tests
        run: pnpm test
